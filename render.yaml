services:
  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI + Uvicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEFAULT_LLM_PROVIDER
        value: auto
      - key: SECRET_KEY
        generateValue: true

  # ---------------------------------------------------------------------------
  # Frontend Web UI (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexora-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexora-backend
          property: host
